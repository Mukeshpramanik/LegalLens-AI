services:
  - type: web
    name: legallens-ai-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: AI_PROVIDER
        value: google-gemini-api
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
